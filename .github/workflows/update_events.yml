name: Update Antalya Events

on:
  push:
    branches:
      - main
    paths:
      - 'scraper.py'
      - 'requirements.txt'
      - '.github/workflows/update_events.yml'
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies and Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Antalya Event Scraper
        run: python scraper.py

      - name: Commit and push updated events
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add events.json antalya_etkinlikler.ics
          git diff --staged --quiet || git commit -m "chore: update Antalya events ($(date +'%Y-%m-%d'))"
          git push
